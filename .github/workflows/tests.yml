name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: food_recognition_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      # No VAULT_ADDR/VAULT_TOKEN here on purpose: DB/OpenAI credentials then
      # fall back to the plain env vars below (see vault_client.py), and
      # tests never need real Slack/OpenAI credentials (see conftest.py's
      # _stub_slack_secrets fixture and CLAUDE.md "Tests").
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ""
      DB_NAME: food_recognition_test
      SECRET_KEY: ci-test-secret
      PHOTO_FOLDER: /tmp/food_recognition_photos
      APP_TIMEZONE: UTC
      OPENAI_API_KEY: sk-not-used-in-tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Matches docker/Dockerfile's apt packages — opencv-python needs these
      # to import at all, even without ever opening a real display.
      - name: Install system dependencies for OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libsm6 libxrender1 libxext6

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -P 3306 -u root --silent && break
            sleep 2
          done

      - name: Run tests
        working-directory: src
        # test_get_food_types (test_similar.py) makes a real OpenAI API call
        # (see CLAUDE.md "Tests" — it needs a valid OPENAI_API_KEY) and isn't
        # suited to run automatically on every push/PR; deselected here, not
        # deleted, so it's still runnable manually with a real key.
        run: python -m pytest test/ -v --deselect test/test_similar.py::test_get_food_types
